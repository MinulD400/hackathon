openapi: 3.1.0
info:
  title: Image2GLB Studio — Multi-source model library (Poly Pizza + Poly Haven)
  version: 0.1.0
  description: >
    Generated by FAPE run 20260810-192054-polypizza-source. Scope: response-schema
    additions to the two existing asset-search endpoints only — no new path, no new verb,
    no breaking change to any existing field. `ResolvedAsset` gains three optional fields
    (`source`, `licence`, `attribution`); `Asset` (used as the ranker's internal candidate
    shape) gains `source`. Both endpoints' request bodies are unchanged.
servers:
  - url: /api
tags:
  - name: assets
paths:
  /assets/find:
    post:
      tags: [assets]
      operationId: findLibraryAssets
      summary: Resolve a description to a ranked list of library models from every configured source
      x-fape-ac: [AC-1, AC-2, AC-5, AC-6, AC-7, AC-8]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindAssetsRequest' }
      responses:
        '200':
          description: >
            OK. `assets` may be empty — a normal outcome when the merged library has
            nothing suitable, distinct from a provider failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindAssetsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/LibraryError' }
        '500': { $ref: '#/components/responses/ServerError' }
      security:
        - {}
  /assets/clarify:
    post:
      tags: [assets]
      operationId: generateAssetQuestions
      summary: Generate clarifying questions from the merged multi-source candidate shortlist
      x-fape-ac: [AC-9]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClarifyRequest' }
      responses:
        '200':
          description: OK. `questions` may be empty — go straight to search.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClarifyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
      security:
        - {}
components:
  responses:
    BadRequest:
      description: Validation failed (e.g. empty/invalid description)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Per-user search rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LibraryError:
      description: Every configured asset-library provider failed (AC-8) — unchanged 502 contract, now reachable from either a Poly Haven-only or a Poly-Pizza-inclusive failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Unexpected error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: array
          items: { type: string }
    Question:
      type: object
      required: [id, text, type]
      properties:
        id: { type: string }
        text: { type: string }
        type: { type: string, enum: [text, choice] }
        options:
          type: array
          items: { type: string }
    Answer:
      type: object
      required: [questionId, answer]
      properties:
        questionId: { type: string }
        answer: { type: string }
    FindAssetsRequest:
      type: object
      required: [description]
      properties:
        description: { type: string }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        answers:
          type: array
          items: { $ref: '#/components/schemas/Answer' }
    ClarifyRequest:
      type: object
      required: [description]
      properties:
        description: { type: string }
    ClarifyResponse:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
    ResolvedAsset:
      type: object
      description: >
        MODIFIED — `source`, `licence`, `attribution` are new and optional; every other
        field is unchanged from the pre-existing Poly-Haven-only shape.
      required: [id, name, gltfUrl, authors]
      properties:
        id:
          type: string
          description: Globally unique, source-namespaced (e.g. "polyhaven:dirty_football", "polypizza:iMNqRzPwwe"). NEW format — was a bare Poly Haven slug before this change.
        name: { type: string }
        gltfUrl:
          type: string
          format: uri
          description: For a polyhaven-sourced asset, our own rewriting route; for a polypizza-sourced asset, Poly Pizza's CDN .glb URL verbatim.
        thumbnailUrl: { type: string, format: uri }
        authors:
          type: object
          additionalProperties: { type: string }
        sizeMetres: { type: number }
        source:
          type: string
          enum: [polyhaven, polypizza]
          description: NEW field.
        licence:
          type: string
          description: NEW field. Present for polypizza assets (e.g. "CC0 1.0", "CC-BY 3.0"); absent for polyhaven assets, which the UI treats as implicitly CC0.
        attribution:
          type: string
          description: NEW field. Full attribution string, shown visibly for licences that require it (NFR-4).
    FindAssetsResponse:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items: { $ref: '#/components/schemas/ResolvedAsset' }
        reason: { type: string }
